
trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: '20.x'
  azureServiceConnection: 'portfolio-azure-connection'
  stagingAppName: 'REPLACE_WITH_STAGING_APP_NAME'
  productionAppName: 'REPLACE_WITH_PRODUCTION_APP_NAME'

stages:

# STAGE 1: CI - Install, build, and test
- stage: Build
  displayName: 'Stage 1 - Build and Test'
  jobs:
  - job: BuildAndTest
    displayName: 'Install dependencies and validate'
    steps:
    - checkout: self

    - task: UseNode@1
      displayName: 'Install Node.js'
      inputs:
        version: $(nodeVersion)

    - script: npm ci
      displayName: 'Install dependencies'

    - script: npm run build --if-present
      displayName: 'Build application'

    - script: npm run test --if-present
      displayName: 'Run tests'

# STAGE 2: Package and publish
- stage: Publish
  displayName: 'Stage 2 - Publish Artifact'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: Package
    steps:
    - checkout: self

    - task: UseNode@1
      inputs:
        version: $(nodeVersion)

    - script: |
        zip -r "$(Build.ArtifactStagingDirectory)/app.zip" . \
          -x ".git/*" "node_modules/*" \
             "azure-pipelines.yml" \
             ".env" ".env.*" \
             "*/.env" "*/.env.*"
      displayName: 'Package application'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish deployment package'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/app.zip'
        artifact: drop

# STAGE 3: CD - Staging deployment
- stage: Deploy_Staging
  displayName: 'Stage 3 - Deploy to Staging'
  dependsOn: Publish
  condition: |
    and(
      succeeded(),
      eq(variables['Build.SourceBranch'], 'refs/heads/main')
    )
  jobs:
  - deployment: DeployStaging
    displayName: 'Deploy staging application'
    environment: portfolio-staging
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop

          - task: AzureWebApp@1
            displayName: 'Deploy to staging App Service'
            inputs:
              azureSubscription: $(azureServiceConnection)
              appType: webAppLinux
              appName: $(stagingAppName)
              package: '$(Pipeline.Workspace)/drop/app.zip'

# STAGE 4: CD - Production deployment
- stage: Deploy_Production
  displayName: 'Stage 4 - Deploy to Production'
  dependsOn: Deploy_Staging
  condition: |
    and(
      succeeded(),
      eq(variables['Build.SourceBranch'], 'refs/heads/main')
    )
  jobs:
  - deployment: DeployProduction
    displayName: 'Deploy production application'
    environment: portfolio-production
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop

          - task: AzureWebApp@1
            displayName: 'Deploy to production App Service'
            inputs:
              azureSubscription: $(azureServiceConnection)
              appType: webAppLinux
              appName: $(productionAppName)
              package: '$(Pipeline.Workspace)/drop/app.zip'
