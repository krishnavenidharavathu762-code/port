
trigger:
  branches:
    include:
      - main

pr: none

variables:
  terraformServiceConnection: 'krishna-conn'
  terraformWorkingDirectory: '$(Build.SourcesDirectory)/infra'
  terraformVersion: '1.9.8'

  # FIRST RUN: Keep false to create infrastructure only.
  # After infrastructure exists and the SWA token is configured,
  # change this to true.
  enableStaticDeployment: 'false'

stages:

# =========================================================
# STAGE 1: TERRAFORM INIT
# =========================================================
- stage: Terraform_Init
  displayName: '1 - Terraform Init'
  jobs:
  - job: Init
    displayName: 'Initialize Terraform'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: 'Install Terraform and initialize backend'
      inputs:
        azureSubscription: '$(terraformServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        addSpnToEnvironment: false
        workingDirectory: '$(terraformWorkingDirectory)'
        inlineScript: |
          set -euo pipefail

          test -f main.tf || {
            echo "ERROR: infra/main.tf not found."
            exit 1
          }

          curl -fsSL \
            "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip" \
            -o /tmp/terraform.zip

          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip
          sudo unzip -o /tmp/terraform.zip -d /usr/local/bin

          terraform version
          terraform init -input=false

# =========================================================
# STAGE 2: TERRAFORM VALIDATE
# =========================================================
- stage: Terraform_Validate
  displayName: '2 - Terraform Validate'
  dependsOn: Terraform_Init
  condition: succeeded()
  jobs:
  - job: Validate
    displayName: 'Validate Terraform configuration'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: 'Initialize and validate'
      inputs:
        azureSubscription: '$(terraformServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: '$(terraformWorkingDirectory)'
        inlineScript: |
          set -euo pipefail

          curl -fsSL \
            "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip" \
            -o /tmp/terraform.zip

          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip
          sudo unzip -o /tmp/terraform.zip -d /usr/local/bin

          terraform init -input=false
          terraform validate

# =========================================================
# STAGE 3: TERRAFORM PLAN
# =========================================================
- stage: Terraform_Plan
  displayName: '3 - Terraform Plan'
  dependsOn: Terraform_Validate
  condition: succeeded()
  jobs:
  - job: Plan
    displayName: 'Create Terraform plan'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: 'Generate Terraform plan'
      inputs:
        azureSubscription: '$(terraformServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: '$(terraformWorkingDirectory)'
        inlineScript: |
          set -euo pipefail

          curl -fsSL \
            "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip" \
            -o /tmp/terraform.zip

          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip
          sudo unzip -o /tmp/terraform.zip -d /usr/local/bin

          terraform init -input=false

          mkdir -p "$(Build.ArtifactStagingDirectory)/tfplan"

          terraform plan \
            -input=false \
            -out="$(Build.ArtifactStagingDirectory)/tfplan/terraform.tfplan"

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform plan'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/tfplan'
        artifact: 'terraform-plan'
        publishLocation: 'pipeline'

# =========================================================
# STAGE 4: TERRAFORM APPLY - CREATE INFRASTRUCTURE
# =========================================================
- stage: Terraform_Apply
  displayName: '4 - Terraform Apply / Create Infrastructure'
  dependsOn: Terraform_Plan
  condition: succeeded()
  jobs:
  - deployment: ApplyInfrastructure
    displayName: 'Apply infrastructure changes'
    environment: 'portfolio-infrastructure-production'
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Terraform plan'
            inputs:
              buildType: 'current'
              artifactName: 'terraform-plan'
              targetPath: '$(Pipeline.Workspace)/terraform-plan'

          - task: AzureCLI@2
            displayName: 'Apply Terraform plan'
            inputs:
              azureSubscription: '$(terraformServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: '$(terraformWorkingDirectory)'
              inlineScript: |
                set -euo pipefail

                curl -fsSL \
                  "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip" \
                  -o /tmp/terraform.zip

                sudo apt-get update -qq
                sudo apt-get install -y -qq unzip
                sudo unzip -o /tmp/terraform.zip -d /usr/local/bin

                terraform init -input=false

                test -f "$(Pipeline.Workspace)/terraform-plan/terraform.tfplan"

                terraform apply \
                  -input=false \
                  -auto-approve \
                  "$(Pipeline.Workspace)/terraform-plan/terraform.tfplan"

                terraform output

# =========================================================
# STAGE 5: PREPARE AND PUBLISH WEBSITE
# This stage runs only after infrastructure is created.
# =========================================================
- stage: Publish_Static_Site
  displayName: '5 - Prepare and Publish Website Artifact'
  dependsOn: Terraform_Apply
  condition: and(succeeded(), eq(variables['enableStaticDeployment'], 'true'))
  jobs:
  - job: PublishSite
    displayName: 'Prepare static website'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self

    - bash: |
        set -euo pipefail

        SOURCE="$(Build.SourcesDirectory)"
        DEST="$(Build.ArtifactStagingDirectory)/site"

        if [ ! -f "$SOURCE/index.html" ]; then
          echo "ERROR: index.html not found in repository root."
          echo "Check where your website files are located."
          exit 1
        fi

        mkdir -p "$DEST"

        tar \
          --exclude='./.git' \
          --exclude='./.terraform' \
          --exclude='./infra' \
          --exclude='./node_modules' \
          --exclude='./terraform.tfstate' \
          --exclude='./terraform.tfstate.backup' \
          --exclude='./terraform.tfplan' \
          -cf - -C "$SOURCE" . | tar -xf - -C "$DEST"

        test -f "$DEST/index.html"

        echo "Website files ready:"
        find "$DEST" -maxdepth 3 -type f | head -100
      displayName: 'Create website artifact folder'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish static-site artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/site'
        artifact: 'static-site'
        publishLocation: 'pipeline'

# =========================================================
# STAGE 6: DEPLOY TO STAGING PREVIEW ENVIRONMENT
# =========================================================
- stage: Deploy_Staging
  displayName: '6 - Deploy Static Web App to Staging'
  dependsOn: Publish_Static_Site
  condition: and(succeeded(), eq(variables['enableStaticDeployment'], 'true'))
  jobs:
  - deployment: DeployStaging
    displayName: 'Deploy staging preview'
    environment: 'portfolio-staging'
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: none

          - task: DownloadPipelineArtifact@2
            displayName: 'Download website artifact'
            inputs:
              buildType: 'current'
              artifactName: 'static-site'
              targetPath: '$(Pipeline.Workspace)/static-site'

          - bash: |
              set -euo pipefail
              test -f "$(Pipeline.Workspace)/static-site/index.html"
              echo "Website artifact verified."
            displayName: 'Verify downloaded artifact'

          - task: AzureStaticWebApp@0
            displayName: 'Deploy to Static Web Apps staging environment'
            inputs:
              workingDirectory: '$(Pipeline.Workspace)'
              app_location: 'static-site'
              output_location: ''
              skip_app_build: true
              skip_api_build: true
              azure_static_web_apps_api_token: '$(swaDeploymentToken)'
              deployment_environment: 'staging'

# =========================================================
# STAGE 7: DEPLOY TO PRODUCTION
# =========================================================
- stage: Deploy_Production
  displayName: '7 - Deploy Static Web App to Production'
  dependsOn: Deploy_Staging
  condition: and(succeeded(), eq(variables['enableStaticDeployment'], 'true'))
  jobs:
  - deployment: DeployProduction
    displayName: 'Deploy production website'
    environment: 'portfolio-production'
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: none

          - task: DownloadPipelineArtifact@2
            displayName: 'Download website artifact'
            inputs:
              buildType: 'current'
              artifactName: 'static-site'
              targetPath: '$(Pipeline.Workspace)/static-site'

          - task: AzureStaticWebApp@0
            displayName: 'Deploy to Static Web Apps production'
            inputs:
              workingDirectory: '$(Pipeline.Workspace)'
              app_location: 'static-site'
              output_location: ''
              skip_app_build: true
              skip_api_build: true
              azure_static_web_apps_api_token: '$(swaDeploymentToken)'
