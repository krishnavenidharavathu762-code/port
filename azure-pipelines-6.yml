
trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  # Azure DevOps Service Connection for Terraform only
  - name: terraformServiceConnection
    value: 'krishna-conn'

  # Website source folder; change if index.html is elsewhere
  - name: siteSource
    value: '.'

  # Keep false until you have added the SWA token as a secret
  # pipeline variable named swaDeploymentToken.
  - name: enableStaticDeployment
    value: 'false'

stages:

# =====================================================
# STAGE 1: CI - Build and validate website
# =====================================================

- stage: Build_Test
  displayName: 'Build and test static site'
  jobs:
  - job: ValidateSite
    displayName: 'Validate HTML, CSS and JavaScript'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self

    - bash: |
        set -e
        echo "Checking static-site files..."
        test -f index.html || {
          echo "ERROR: index.html was not found in the repository root."
          exit 1
        }

        echo "Static-site files found:"
        find . -maxdepth 2 -type f \
          ! -path './.git/*' \
          ! -path './.terraform/*' \
          ! -name '*.tfstate*' \
          ! -name 'terraform.tfplan' \
          | head -100
      displayName: 'Check static-site files'

    - bash: |
        set -e
        mkdir -p "$(Build.ArtifactStagingDirectory)/site"

        # Copy the website files while excluding Git and Terraform files.
        tar \
          --exclude='./.git' \
          --exclude='./infra' \
          --exclude='./.terraform' \
          --exclude='./terraform.tfstate' \
          --exclude='./terraform.tfstate.backup' \
          --exclude='./terraform.tfplan' \
          -cf - . | \
          tar -xf - -C "$(Build.ArtifactStagingDirectory)/site"

        test -f "$(Build.ArtifactStagingDirectory)/site/index.html"
        echo "Artifact folder created:"
        ls -la "$(Build.ArtifactStagingDirectory)/site"
      displayName: 'Prepare static-site artifact'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish static-site artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/site'
        artifact: 'static-site'
        publishLocation: 'pipeline'

# =====================================================
# STAGE 2: Publish website artifact
# =====================================================
- stage: Publish
  displayName: 'Stage 2 - Publish Website Artifact'
  dependsOn: Build_Test
  jobs:
    - job: PublishSite
      steps:
        - publish: '$(Build.ArtifactStagingDirectory)/site'
          artifact: static-site
          displayName: 'Publish static-site artifact'

# =====================================================
# STAGE 3: Terraform init
# =====================================================
- stage: Terraform_Init
  displayName: 'Stage 3 - Terraform Init'
  dependsOn: Publish
  jobs:
    - job: Init
      steps:
        - checkout: self

        - task: AzureCLI@2
          displayName: 'Terraform init'
          inputs:
            azureSubscription: $(terraformServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -euo pipefail

              cd "$(Build.SourcesDirectory)/infra"

              TF_VERSION="1.9.8"
              curl -fsSLo /tmp/terraform.zip \
                "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
              sudo unzip -o /tmp/terraform.zip -d /usr/local/bin
              terraform version
              terraform init -input=false

# =====================================================
# STAGE 4: Terraform validate
# =====================================================
- stage: Terraform_Validate
  displayName: 'Stage 4 - Terraform Validate'
  dependsOn: Terraform_Init
  jobs:
    - job: Validate
      steps:
        - checkout: self

        - task: AzureCLI@2
          displayName: 'Format and validate Terraform'
          inputs:
            azureSubscription: $(terraformServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -euo pipefail

              cd "$(Build.SourcesDirectory)/infra"

              TF_VERSION="1.9.8"
              curl -fsSLo /tmp/terraform.zip \
                "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
              sudo unzip -o /tmp/terraform.zip -d /usr/local/bin

              terraform init -input=false
              terraform fmt -check -recursive
              terraform validate

# =====================================================
# STAGE 5: Terraform plan
# =====================================================
- stage: Terraform_Plan
  displayName: 'Stage 5 - Terraform Plan'
  dependsOn: Terraform_Validate
  jobs:
    - job: Plan
      steps:
        - checkout: self

        - task: AzureCLI@2
          displayName: 'Create Terraform plan'
          inputs:
            azureSubscription: $(terraformServiceConnection)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -euo pipefail

              cd "$(Build.SourcesDirectory)/infra"

              TF_VERSION="1.9.8"
              curl -fsSLo /tmp/terraform.zip \
                "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
              sudo unzip -o /tmp/terraform.zip -d /usr/local/bin

              terraform init -input=false
              terraform plan -input=false -out=tfplan

              mkdir -p "$(Build.ArtifactStagingDirectory)/tfplan"
              cp tfplan "$(Build.ArtifactStagingDirectory)/tfplan/tfplan"

        - publish: '$(Build.ArtifactStagingDirectory)/tfplan'
          artifact: terraform-plan
          displayName: 'Publish saved Terraform plan'

# =====================================================
# STAGE 6: Terraform apply
# Configure approval on portfolio-infrastructure-production.
# =====================================================
- stage: Terraform_Apply
  displayName: 'Stage 6 - Terraform Apply'
  dependsOn: Terraform_Plan
  condition: succeeded()
  jobs:
    - deployment: ApplyInfrastructure
      displayName: 'Apply reviewed infrastructure plan'
      environment: portfolio-infrastructure-production
      strategy:
        runOnce:
          deploy:
            steps:
              - checkout: self

              - download: current
                artifact: terraform-plan

              - task: AzureCLI@2
                displayName: 'Apply Terraform plan'
                inputs:
                  azureSubscription: $(terraformServiceConnection)
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    set -euo pipefail

                    cd "$(Build.SourcesDirectory)/infra"

                    TF_VERSION="1.9.8"
                    curl -fsSLo /tmp/terraform.zip \
                      "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
                    sudo unzip -o /tmp/terraform.zip -d /usr/local/bin

                    terraform init -input=false
                    terraform apply -input=false -auto-approve \
                      "$(Pipeline.Workspace)/terraform-plan/tfplan"

# =====================================================
# STAGE 7: Deploy to Static Web Apps staging preview
# =====================================================
- stage: Deploy_Staging
  displayName: 'Stage 7 - Deploy Staging'
  dependsOn: Terraform_Apply
  condition: |
    and(
      succeeded(),
      eq(variables['Build.SourceBranch'], 'refs/heads/main'),
      eq(variables['enableStaticDeployment'], 'true')
    )
  jobs:
    - deployment: DeployStaging
      displayName: 'Deploy staging preview'
      environment: portfolio-staging
      strategy:
        runOnce:
          deploy:
            steps:
              - download: current
                artifact: static-site

              - task: AzureStaticWebApp@0
                displayName: 'Deploy to Static Web Apps preview'
                inputs:
                  cwd: '$(Pipeline.Workspace)/static-site'
                  app_location: '/'
                  output_location: ''
                  skip_app_build: true
                  skip_api_build: true
                  deployment_environment: 'staging'
                  azure_static_web_apps_api_token: $(swaDeploymentToken)

# =====================================================
# STAGE 8: Deploy to production
# Configure approval on portfolio-production.
# =====================================================
- stage: Deploy_Production
  displayName: 'Stage 8 - Deploy Production'
  dependsOn: Deploy_Staging
  condition: |
    and(
      succeeded(),
      eq(variables['Build.SourceBranch'], 'refs/heads/main'),
      eq(variables['enableStaticDeployment'], 'true')
    )
  jobs:
    - deployment: DeployProduction
      displayName: 'Deploy production website'
      environment: portfolio-production
      strategy:
        runOnce:
          deploy:
            steps:
              - download: current
                artifact: static-site

              - task: AzureStaticWebApp@0
                displayName: 'Deploy to Static Web Apps production'
                inputs:
                  cwd: '$(Pipeline.Workspace)/static-site'
                  app_location: '/'
                  output_location: ''
                  skip_app_build: true
                  skip_api_build: true
                  azure_static_web_apps_api_token: $(swaDeploymentToken)
